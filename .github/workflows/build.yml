name: Build AX6000 25.12 (mtkuboot)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - '.github/workflows/build.yml'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get purge -y --auto-remove azure-cli google-chrome-stable firefox powershell 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: 拉取源码（chasey-dev 25.12 闭源驱动）
        run: |
          git clone --depth=1 -b 25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          cd openwrt && git log --oneline -1

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        run: |
          cd openwrt
          cp defconfig/mt7986-ax6000.config .config
          cat ../config/extra-kmods.config >> .config
          make defconfig
          echo "===== 设备选择情况 ====="
          grep -E 'DEVICE_xiaomi_redmi-router-ax6000' .config || true

      - name: 校验必需 kmod（缺失即失败）
        run: |
          cd openwrt
          miss=0
          while read -r s; do
            [ -z "$s" ] && continue
            if grep -qx "$s=y" .config; then echo "OK   $s"; else echo "MISS $s"; miss=1; fi
          done < ../config/expect.txt
          if [ "$miss" = "1" ]; then echo "::error::必需 kmod 未被选中，请查看上面的 MISS 行"; exit 1; fi

      - name: 汇总期望 kmod（缺失只告警）
        run: |
          cd openwrt
          {
            echo "### 期望 kmod 检查"
            echo ""
            echo "| 组件 | 结果 |"
            echo "|---|---|"
            while read -r s; do
              [ -z "$s" ] && continue
              if grep -qx "$s=y" .config; then echo "| $s | ✅ 已选中 |"; else echo "| $s | ⚠️ 源码中不存在或未选中 |"; fi
            done < ../config/want.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 下载源码包
        run: |
          cd openwrt
          make -j"$(nproc)" download V=s || make -j1 download V=s

      - name: 编译
        run: |
          cd openwrt
          make -j"$(nproc)" V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ax6000-mtkuboot
          path: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: warn

      - name: 上传 kmod ipk
        uses: actions/upload-artifact@v4
        with:
          name: kmod-ipk
          path: openwrt/bin/packages/*/kmods/*.ipk
          if-no-files-found: warn
