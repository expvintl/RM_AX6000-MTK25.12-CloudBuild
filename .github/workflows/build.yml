name: Build AX6000 25.12 (mtkuboot)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      SRC_REPO: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
      SRC_BRANCH: "25.12"
      SEED: defconfig/mt7986-ax6000.config
      DEVICE: xiaomi_redmi-router-ax6000-mtkuboot
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "== 处理前 =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /opt/az /usr/lib/google-cloud-sdk /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/Java_* /opt/hostedtoolcache/go \
                      /opt/hostedtoolcache/node 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get -qq clean 2>/dev/null || true
          echo "== 处理后 =="
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget libelf-dev ecj fastjar \
            java-propose-classpath subversion device-tree-compiler \
            qemu-utils ccache upx-ucl

      - name: 拉取源码（chasey-dev 25.12 闭源驱动）
        run: |
          git clone --depth 1 --branch "$SRC_BRANCH" "$SRC_REPO" openwrt
          cd openwrt
          echo "== 源码版本 =="
          git log -1 --format='%h %ad %s' --date=short

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        run: |
          cd openwrt
          if [ -f "$SEED" ]; then SP="$SEED"
          elif [ -f "../$SEED" ]; then SP="../$SEED"
          else echo "::error::找不到 defconfig: $SEED"; ls defconfig 2>/dev/null || true; exit 1
          fi
          echo "seed = $SP"
          cp "$SP" .config
          cat ../config/extra-kmods.config >> .config
          make defconfig

          echo "== 目标设备（seed 结果）=="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi' .config || echo "(无)"

          if ! grep -q "^CONFIG_TARGET_DEVICE_[^=]*_${DEVICE}=y" .config; then
            echo "::warning::seed 未启用 ${DEVICE}，自动补启后重新 defconfig"
            sed -i -E 's|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000[^=]*=y|# &#|' .config
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config
            make defconfig
          fi

          echo "== 目标设备（最终）=="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi' .config || echo "(无)"
          echo "== 已选 kmod 数量 =="
          grep -cE '^CONFIG_PACKAGE_kmod-[a-z0-9_-]+=[ym]' .config

          if ! grep -q "^CONFIG_TARGET_DEVICE_[^=]*_${DEVICE}=y" .config; then
            echo "::error::设备 ${DEVICE} 没有被选中（源码树里可能没有该变体）"
            exit 1
          fi

      - name: 校验必需 kmod（缺失即失败）
        run: |
          cd openwrt
          fail=0
          while read -r raw; do
            case "$raw" in ''|\#*) continue ;; esac
            name="${raw%%=*}"
            name="${name#CONFIG_PACKAGE_}"
            if grep -qE "^CONFIG_PACKAGE_${name}=[ym]" .config; then
              echo "OK   CONFIG_PACKAGE_${name}"
            else
              echo "MISS CONFIG_PACKAGE_${name}"
              grep -E "CONFIG_PACKAGE_${name}" .config || echo "     (源码树里不存在该符号)"
              fail=1
            fi
          done < ../config/expect.txt
          if [ "$fail" -ne 0 ]; then
            echo "::error::必需项未被选中，请看上面的 MISS 行"
            exit 1
          fi
          echo "全部必需项已选中"

      - name: 汇总期望 kmod（缺失只告警）
        run: |
          cd openwrt
          {
            echo "## 期望 kmod 检查"
            echo ""
            echo "| kmod | 结果 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          missn=0
          while read -r raw; do
            case "$raw" in ''|\#*) continue ;; esac
            name="${raw%%=*}"
            name="${name#CONFIG_PACKAGE_}"
            if grep -qE "^CONFIG_PACKAGE_${name}=[ym]" .config; then
              echo "| $name | 已选中 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | 未选中 |" >> "$GITHUB_STEP_SUMMARY"
              missn=$((missn + 1))
            fi
          done < ../config/want.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "未选中 $missn 项（不影响构建，说明源码树里没有该包）" >> "$GITHUB_STEP_SUMMARY"

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8 || echo "::warning::部分源码包下载失败，编译阶段会重试"

      - name: 编译
        run: |
          cd openwrt
          echo "开始 $(date -u '+%F %T UTC')"
          echo "== 编译前磁盘 =="
          df -h / | tail -2
          set +e
          make -j"$(nproc)" > /tmp/build.log 2>&1 &
          BUILD_PID=$!
          echo "make PID = $BUILD_PID"
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            sleep 120
            LINES=$(wc -l < /tmp/build.log 2>/dev/null || echo 0)
            LAST=$(tail -n 1 /tmp/build.log 2>/dev/null | cut -c1-150)
            DF=$(df -h / | awk 'NR==2{print $4}')
            echo "[$(date -u +%H:%M)] ${LINES} 行 | 剩余磁盘 ${DF} | ${LAST}"
          done
          wait "$BUILD_PID"
          RC=$?
          set -e
          echo "结束 $(date -u '+%F %T UTC')  make 退出码=$RC"
          df -h / | tail -2
          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败（退出码 $RC），最后 400 行："
            tail -n 400 /tmp/build.log
            exit "$RC"
          fi
          echo "== 编译日志最后 60 行 =="
          tail -n 60 /tmp/build.log
          echo "== 产物 =="
          ls -lh bin/targets/mediatek/filogic/ | tail -25

      - name: 定位 ipk 目录
        run: |
          cd openwrt
          echo "== bin 结构 =="
          find bin -maxdepth 3 -type d | sort | head -40
          echo "== ipk 分布统计 =="
          find bin -name '*.ipk' | sed -E 's#/[^/]+$##' | sort | uniq -c | sort -rn | head -20

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ax6000-mtkuboot
          path: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: warn

      - name: 上传 kmod ipk
        uses: actions/upload-artifact@v4
        with:
          name: kmod-ipk
          path: |
            openwrt/bin/**/kmods/*.ipk
            openwrt/bin/targets/**/packages/*.ipk
          if-no-files-found: warn
